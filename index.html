<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Official Exam — Department of Pathology</title>
<style>
:root{--navy:#0b2a4a;--navy2:#14385e;--teal:#0e9f9a;--teal-d:#0b7f7b;--teal-l:#e3f5f3;--ink:#172433;--muted:#5d7085;--line:#d8e1ea;--bg:#f3f6f9;--card:#fff;--red:#b42318;--red-l:#fdecec;--amber:#b45309;--amber-l:#fff4e0;--green:#166534;--green-l:#e8f7ee;--radius:14px}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal-d)}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:.86rem}.tiny{font-size:.78rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.right{margin-left:auto}
.btn{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font-weight:650;display:inline-flex;align-items:center;gap:6px;min-height:42px}
.btn:hover{border-color:#b9c7d6}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn-primary:hover{background:var(--teal-d);border-color:var(--teal-d)}
.btn-navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-danger{border-color:#f0b4ae;color:var(--red)}.btn-danger:hover{background:var(--red-l)}
.btn-sm{padding:5px 11px;min-height:34px;font-size:.88rem;border-radius:8px}
.btn-link{background:none;border:0;color:var(--teal-d);font-weight:650;padding:4px}
input[type=text],input[type=password],input[type=number],input[type=datetime-local],input[type=search],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
input,select,textarea{font-weight:400}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,159,154,.18)}
textarea{min-height:90px;resize:vertical}
label.f{display:block;margin-bottom:14px;font-weight:650;font-size:.92rem}label.f>span{display:block;margin-bottom:5px}
label.chk{display:flex;gap:9px;align-items:flex-start;margin:8px 0;font-size:.94rem}label.chk input{margin-top:4px;width:18px;height:18px;flex:none}
.msg{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.92rem}.msg:empty{display:none}
.msg.bad{background:var(--red-l);color:var(--red)}.msg.ok{background:var(--green-l);color:var(--green)}.msg.info{background:#e8f1fb;color:#1d4f73}.msg.warn{background:var(--amber-l);color:var(--amber)}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;background:#eef2f6;color:#3d5268;white-space:nowrap}
.badge.teal{background:var(--teal-l);color:var(--teal-d)}.badge.red{background:var(--red-l);color:var(--red)}.badge.amber{background:var(--amber-l);color:var(--amber)}.badge.green{background:var(--green-l);color:var(--green)}.badge.navy{background:var(--navy);color:#fff}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 2px rgba(16,40,70,.06),0 4px 18px rgba(16,40,70,.06);padding:22px}
/* gate / centered screens */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(160deg,#0b2a4a,#0e6f78)}
.gate .card{width:100%;max-width:440px}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.brand .mark{width:52px;height:52px;border-radius:14px;background:var(--teal-l);display:grid;place-items:center;flex:none}
.brand .mark svg{width:28px;height:28px;color:var(--teal-d)}
.brand .t1{font-weight:800;font-size:1.12rem;color:var(--navy)}.brand .t2{font-size:.84rem;color:var(--muted)}
h1,h2,h3{color:var(--navy);line-height:1.25}h1{font-size:1.45rem;margin:0 0 6px}h2{font-size:1.2rem;margin:0 0 10px}h3{font-size:1.02rem;margin:0 0 8px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.fact{background:var(--bg);border-radius:11px;padding:11px 13px}.fact b{display:block;font-size:1.15rem;color:var(--navy)}.fact span{font-size:.8rem;color:var(--muted)}
.instr{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:.94rem}
/* exam screen */
.xbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.xbar .ttl{font-weight:750}.xbar .who{font-size:.84rem;opacity:.85}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.25rem;background:rgba(255,255,255,.12);border-radius:10px;padding:5px 12px;min-width:104px;text-align:center}
.timer.warn{background:#b45309}.timer.crit{background:#b42318;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.75}}
.save{font-size:.82rem;border-radius:999px;padding:3px 10px;background:rgba(255,255,255,.12)}.save.bad{background:#b42318}
.xwrap{max-width:1100px;margin:0 auto;padding:18px 16px 90px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px}
@media(max-width:860px){.xwrap{grid-template-columns:minmax(0,1fr)}.nav-panel .card{position:static}}
.qcard{background:#fff;border-radius:var(--radius);box-shadow:0 1px 2px rgba(16,40,70,.06),0 4px 18px rgba(16,40,70,.06);padding:22px;user-select:none;-webkit-user-select:none}
.qhead{display:flex;align-items:center;gap:8px 10px;margin-bottom:12px;flex-wrap:wrap}.qnum{font-weight:800;color:var(--navy)}
.case{background:#f4f8fb;border-left:0;border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:.96rem}
.stem{font-size:1.08rem;font-weight:600;margin-bottom:16px;white-space:pre-wrap}
.qimg{max-width:100%;max-height:360px;border-radius:10px;border:1px solid var(--line);margin:0 0 14px;cursor:zoom-in;display:block}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;text-align:left;width:100%}
.opt:hover{border-color:#aebfd0}.opt.sel{border-color:var(--teal);background:var(--teal-l)}
.opt .let{flex:none;width:28px;height:28px;border-radius:50%;background:#eef2f6;display:grid;place-items:center;font-weight:800;font-size:.86rem}
.opt.sel .let{background:var(--teal);color:#fff}
.opt .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid #9fb1c3;display:grid;place-items:center;margin-top:3px}
.opt.sel .box{background:var(--teal);border-color:var(--teal);color:#fff}
.tfrow{display:flex;gap:12px}.tfrow .opt{justify-content:center;font-weight:750;font-size:1.05rem}
.blank{display:inline-block;width:auto;min-width:160px;max-width:100%;margin:2px 4px;padding:6px 10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #edf1f5}
@media(max-width:560px){.mrow{grid-template-columns:minmax(0,1fr)}}
.qfoot{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.nav-panel .card{padding:16px;position:sticky;top:76px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}
.gbtn{position:relative;border:1.5px solid var(--line);background:#fff;border-radius:9px;height:38px;font-weight:700;font-size:.9rem}
.gbtn.ans{background:var(--teal-l);border-color:#9fd9d4;color:var(--teal-d)}.gbtn.cur{outline:2.5px solid var(--navy);outline-offset:1px}
.gbtn.flag::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:#f59e0b}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.warnbar{background:var(--amber-l);color:var(--amber);font-size:.88rem;padding:8px 16px;text-align:center}
.done-ic{width:68px;height:68px;border-radius:50%;background:var(--green-l);color:var(--green);display:grid;place-items:center;margin:0 auto 12px}
.done-ic svg{width:36px;height:36px}
/* teacher */
.tbar{background:var(--navy);color:#fff;padding:0 16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:58px}
.tbar .ttl{font-weight:800;margin-right:14px}
.tab{background:none;border:0;color:#c7d6e6;font-weight:700;padding:18px 12px;border-bottom:3px solid transparent}.tab.on{color:#fff;border-bottom-color:var(--teal)}
.twrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th{text-align:left;font-size:.76rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border-bottom:2px solid var(--line);padding:9px 8px;white-space:nowrap}
table.t td{border-bottom:1px solid #edf1f5;padding:9px 8px;vertical-align:top}
table.t tr:hover td{background:#fafcfd}
.tscroll{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.kpi{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 2px rgba(16,40,70,.06)}.kpi b{display:block;font-size:1.45rem;color:var(--navy)}.kpi span{font-size:.78rem;color:var(--muted)}
.excard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;margin-bottom:12px}
@media(max-width:700px){.excard{grid-template-columns:minmax(0,1fr)}}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media(max-width:700px){.two{grid-template-columns:minmax(0,1fr)}}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}@media(max-width:700px){.three{grid-template-columns:minmax(0,1fr)}}
.qlist{max-height:420px;overflow:auto;border:1.5px solid var(--line);border-radius:11px}
.qitem{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid #edf1f5;font-size:.9rem}.qitem:last-child{border-bottom:0}
.qitem input{margin-top:4px;width:17px;height:17px;flex:none}
.modal-bg{position:fixed;inset:0;background:rgba(10,25,40,.55);display:grid;place-items:center;padding:16px;z-index:100}
.modal{background:#fff;border-radius:16px;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:1000px}
.ans-ok{color:var(--green);font-weight:700}.ans-bad{color:var(--red);font-weight:700}
.dq{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.dq .o{padding:4px 8px;border-radius:7px;margin:3px 0}.dq .o.c{background:var(--green-l)}.dq .o.w{background:var(--red-l)}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:200;cursor:zoom-out}.zoom img{max-width:95vw;max-height:92vh}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ==========================================================================
   Official Exam App (v1.0) — Department of Pathology
   A separate application: it contains NO course content, NO question bank and
   NO answer keys. Everything is served, timed and graded by the backend
   (Google Apps Script, Code.gs ≥ 1.7). The student paper arrives without answers,
   explanations, question ids or original option positions.
   ========================================================================== */
'use strict';
const CONFIG = {
  backendUrl: 'https://script.google.com/macros/s/AKfycbzx0Yg0YAaJ8mAvcHoondUmlS-DtZTjrvnLvcAE-tNSF3McBcV-znF0-S8PV54_XrM/exec',
  defaultModule: 'inflhealing',
  modules: {
    inflhealing: { title: 'Inflammation & Healing', courseUrl: 'https://third-year-med.github.io/inflammation-healing/' },
    cellinjury: { title: 'Cell Injury & Cell Death', courseUrl: 'https://third-year-med.github.io/cell-injury-teaching-platform/' }
  },
  department: 'Department of Pathology',
  author: 'Dr. Wesam Alzwawy'
};
const QS = new URLSearchParams(location.search);
const MODULE = (QS.get('m') || CONFIG.defaultModule).replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 40) || CONFIG.defaultModule;
const BASE = MODULE.split('-')[0];
const MOD = CONFIG.modules[BASE] || { title: MODULE, courseUrl: '' };
const BACKEND = (window.EXAM_BACKEND_URL || CONFIG.backendUrl);
const TYPE_LABEL = { mcq: 'Single best answer', vignette: 'Clinical vignette', tf: 'True / False', selectall: 'Select all that apply', fillblank: 'Fill in the blank', matching: 'Matching' };
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

/* ---------- tiny helpers ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k]; if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else if (k in e && typeof v !== 'string') e[k] = v; else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(9)) if (c !== null && c !== undefined && c !== false) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}
const $ = s => document.querySelector(s);
const app = () => document.getElementById('app');
function kids(list) { return list.flat(9).filter(x => x !== null && x !== undefined && x !== false).map(x => x instanceof Node ? x : document.createTextNode(String(x))); }
function put(el, ...k) { el.replaceChildren(...kids(k)); }
function mount(...nodes) { put(app(), nodes); window.scrollTo(0, 0); }
function fmtDT(ms) { if (!ms) return '—'; const d = new Date(ms); return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }); }
function fmtT(ms) { return ms ? new Date(ms).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) : '—'; }
function fmtDur(ms) { if (ms == null || ms < 0) return '—'; const m = Math.round(ms / 60000); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; }
function clock(ms) { ms = Math.max(0, ms); const s = Math.floor(ms / 1000), hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60; return (hh ? hh + ':' + String(mm).padStart(2, '0') : String(mm).padStart(2, '0')) + ':' + String(ss).padStart(2, '0'); }
const ICON = {
  micro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18h8"/><path d="M3 22h18"/><path d="M14 22a7 7 0 1 0 0-14h-1"/><path d="M9 14h2"/><path d="M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2Z"/><path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
};
function brand(sub) {
  return h('div', { class: 'brand' }, h('div', { class: 'mark', html: ICON.micro }),
    h('div', null, h('div', { class: 't1' }, 'Official Exam'), h('div', { class: 't2' }, sub || (MOD.title + ' · ' + CONFIG.department))));
}
function toast(text, kind) {
  const t = h('div', { class: 'msg ' + (kind || 'ok'), style: 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:300;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:92vw' }, text);
  document.body.append(t); setTimeout(() => t.remove(), 3500);
}
function modal(title, body, opts) {
  const o = opts || {};
  const close = () => { bg.remove(); document.removeEventListener('keydown', esc); if (o.onClose) o.onClose(); };
  const esc = e => { if (e.key === 'Escape' && !o.noEsc) close(); };
  const bg = h('div', { class: 'modal-bg', onclick: e => { if (e.target === bg && !o.noEsc) close(); } },
    h('div', { class: 'modal' + (o.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
      h('div', { class: 'row', style: 'margin-bottom:10px' }, h('h2', { style: 'margin:0' }, title), o.noEsc ? null : h('button', { class: 'btn btn-sm right', onclick: close, 'aria-label': 'Close' }, '✕')), body));
  document.body.append(bg); document.addEventListener('keydown', esc);
  const f = bg.querySelector('input,textarea,select,button.btn-primary'); if (f) setTimeout(() => f.focus(), 30);
  return { close, el: bg };
}
function confirmBox(title, text, okLabel, danger) {
  return new Promise(res => {
    let done = false;
    const m = modal(title, h('div', null, h('p', null, text), h('div', { class: 'row', style: 'justify-content:flex-end;margin-top:16px' },
      h('button', { class: 'btn', onclick: () => { done = true; m.close(); res(false); } }, 'Cancel'),
      h('button', { class: 'btn ' + (danger ? 'btn-danger' : 'btn-primary'), onclick: () => { done = true; m.close(); res(true); } }, okLabel || 'OK'))), { onClose: () => { if (!done) res(false); } });
  });
}
function zoomImg(src) { const z = h('div', { class: 'zoom', onclick: () => z.remove() }, h('img', { src, alt: 'Enlarged image' })); document.body.append(z); }

/* ---------- backend ---------- */
const API = {
  async call(action, payload, opts) {
    const o = opts || {}, ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), o.timeout || 30000);
    try {
      const r = await fetch(BACKEND, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ module: MODULE, action }, payload || {})), signal: ctrl.signal, redirect: 'follow' });
      const j = await r.json();
      return j || { ok: false, error: 'Empty answer from the server.' };
    } catch (e) {
      return { ok: false, network: true, error: e.name === 'AbortError' ? 'The server did not answer in time. Check the connection and try again.' : 'Cannot reach the exam server. Check the internet connection.' };
    } finally { clearTimeout(t); }
  }
};
const SS = {
  get(k, d) { try { const v = sessionStorage.getItem('xm_' + MODULE + '_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { sessionStorage.setItem('xm_' + MODULE + '_' + k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { sessionStorage.removeItem('xm_' + MODULE + '_' + k); } catch (e) { } }
};

/* ==========================================================================
   STUDENT
   ========================================================================== */
const Stu = {
  s: null,                // { etoken, student, exam }
  paper: null, resp: {}, flags: {}, cur: 0,
  attempt: null, offset: 0, dirty: false, saving: false, lastSaved: 0, saveErr: '', leaves: 0, submitting: false, timerId: null, saveId: null, pollId: null,

  start() {
    const s = SS.get('sess', null);
    if (!(s && s.etoken)) return this.loginView();
    this.s = s; this.leaves = SS.get('leaves', 0);
    if (SS.get('started', false)) return this.resume();
    API.call('examStatus', { etoken: s.etoken }).then(r => {   // refreshed in the lobby: never start the timer without the Start button
      if (!r.ok) { this.clear(); return this.loginView(r.code === 'examauth' ? 'Please sign in again.' : r.error, 'info'); }
      this.offset = r.exam.serverTime - Date.now();
      if (r.attempt && r.attempt.status === 'submitted') return this.doneView(r.attempt);
      if (r.attempt) { SS.set('started', true); return this.resume(); }
      this.lobby(r.exam);
    });
  },
  loginView(msg, kind) {
    const code = h('input', { type: 'text', id: 'x-code', autocomplete: 'off', autocapitalize: 'characters', spellcheck: false, placeholder: 'Given by the invigilator' });
    const user = h('input', { type: 'text', id: 'x-user', autocomplete: 'username', spellcheck: false, placeholder: 'Your student ID' });
    const pw = h('input', { type: 'password', id: 'x-pw', autocomplete: 'current-password', placeholder: 'Your password' });
    const m = h('div', { class: 'msg ' + (kind || 'bad'), role: 'alert' }, msg || '');
    const btn = h('button', { class: 'btn btn-primary', type: 'submit', style: 'width:100%;justify-content:center' }, 'Enter the exam');
    const form = h('form', { onsubmit: async e => {
      e.preventDefault(); m.className = 'msg bad'; m.textContent = '';
      if (!code.value.trim() || !user.value.trim() || !pw.value) { m.textContent = 'Enter the exam code, your student ID and your password.'; return; }
      btn.disabled = true; btn.textContent = 'Checking…';
      const r = await API.call('examLogin', { code: code.value.trim(), username: user.value.trim(), password: pw.value });
      btn.disabled = false; btn.textContent = 'Enter the exam';
      if (!r.ok) { m.textContent = r.error || 'Sign-in failed.'; pw.value = ''; pw.focus(); return; }
      this.s = { etoken: r.etoken, student: r.student, exam: r.exam };
